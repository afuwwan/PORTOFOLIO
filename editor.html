<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">← Back to Site</a>
            <span class="logo">Editor Mode</span>
        </div>
    </nav>

    <main class="container editor-container">
        <div class="editor-header">
            <h1>Manage Portfolio</h1>
            <p>Changes are saved locally to your browser. You can export a backup of your data.</p>
            <div class="header-actions">
                <button id="btn-export" class="btn btn-outline">Export Backup (JSON)</button>
                <button id="btn-reset" class="btn btn-danger">Reset to Default</button>
            </div>
        </div>

        <section class="editor-section">
            <h2>Profile Settings</h2>
            <form id="profile-form">
                <div class="form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="edit-bio">Short Bio</label>
                    <textarea id="edit-bio" class="form-control" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-about">Extended About Me</label>
                    <textarea id="edit-about" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Profile</button>
            </form>
        </section>

        <section class="editor-section">
            <div class="section-header-flex">
                <h2>Projects</h2>
                <button id="btn-add-project" class="btn btn-primary">Add New Project</button>
            </div>
            
            <div id="projects-list" class="projects-list">
                <!-- Projects injected here -->
            </div>
        </section>

        <!-- Project Modal -->
        <div id="project-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modal-title">Add Project</h2>
                <form id="project-form">
                    <input type="hidden" id="proj-id">
                    <div class="form-group">
                        <label for="proj-title">Title</label>
                        <input type="text" id="proj-title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="proj-category">Category</label>
                        <input type="text" id="proj-category" class="form-control" placeholder="e.g. VR, Game, Web" required>
                    </div>
                    <div class="form-group">
                        <label for="proj-desc">Description</label>
                        <textarea id="proj-desc" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="proj-image">Image URL</label>
                        <input type="text" id="proj-image" class="form-control" placeholder="assets/image.png" required>
                    </div>
                    <div class="form-group">
                        <label for="proj-link">Live Link URL (Optional)</label>
                        <input type="text" id="proj-link" class="form-control" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="proj-repo">Repository URL (Optional)</label>
                        <input type="text" id="proj-repo" class="form-control" placeholder="https://github.com/...">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Project</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="editor.js"></script>
</body>
</html>
